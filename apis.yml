aid: hound-labs
name: Hound Labs
description: >-
  Hound Labs was a breath-measurement company founded in 2014 in the San Francisco Bay Area that built
  the HOUND CANNABIS BREATHALYZER, an ultra-sensitive analytical test that identifies THC molecules in
  breath down to picogram levels and so narrows cannabis detection to a two-to-three hour recent-use
  window rather than the days-to-weeks window of urine testing. The company shipped its first commercial
  product, the HOUND CANNABIS BREATHALYZER Collect + Send, in 2023 into construction, energy, gaming,
  manufacturing and transportation employers, pairing the handheld device with the Hound Labs Retriever
  results portal for paperless chain-of-custody and result delivery. The business now trades as Hound
  Diagnostics, whose about page states it is "formerly known as Hound Labs" and which sells Hound
  Breathalyzer, Hound Screens (a customizable panel covering cannabis plus up to nineteen substances),
  Hound Chart (a HIPAA-compliant cloud results platform) and Hound Check background screening. The
  original houndlabs.com host has been decommissioned and now answers a Flywheel "Unknown Domain" 404
  behind a TLS certificate that does not cover the name; neither the retired domain nor the live
  successor site publishes a developer program, API reference, SDK, or machine-readable contract of any
  kind, so the products are sold and delivered as devices plus a customer-facing web dashboard rather
  than as a programmable surface.
